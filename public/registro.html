<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Hotel - Registro</title>
</head>
<body>
    <h1>Hotel La Bombonera</h1>
    <div id="form">
        <!-- El id="form-register" activa la lógica de registro en app.js. Como comparte el mismo app.js con index.html, cada página solo ejecuta el bloque cuyo formulario existe en el DOM -->
        <form id="form-register">
            <!-- Estos ids deben coincidir con los document.getElementById() del bloque de registro en app.js: nombre, apellido, dni, password -->
            <input name="nombre" id="nombre" class="form-control" type="text" placeholder="Ingrese nombre" required>
            <input name="apellido" id="apellido" class="form-control" type="text" placeholder="Ingrese apellido" required>
            <input name="dni" id="dni" class="form-control" type="text" placeholder="Ingrese DNI" required>
            <input name="password" id="password" class="pass-form-control" type="password" placeholder="Ingrese contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
    </div>

    <!-- app.js al final del body, mismo criterio que en index.html -->
    <script src="app.js"></script>
</body>
</html>
